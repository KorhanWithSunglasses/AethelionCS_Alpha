<!DOCTYPE html>
<html lang="tr">
<head>

    <title>DiziBOX - Yabancı Dizi izle, Yabancı Diziler</title>
</head>
<body class="home">
    <header class="navbar header-main">
        <div class="container">
            <a class="logo pull-left m-r-2" href="https://www.dizibox.live">
                <div>dizibox.</div>
                <div>king of the tv series</div>
            </a>
            <input class="form-control" id="s" name="s" placeholder="Arama yapın..." />

    <main class="content-main container">
        <section class="series-section" id="expected-series">
            <h2>Beklenen / Eklenen Diziler</h2>
            <div class="series-grid">
                <a href="https://www.dizibox.live/diziler/harry-potter/" title="Harry Potter 1. Sezon" class="series-card">
                    <div class="poster"><img src="https://www.dizibox.live/wp-content/uploads/harry-potter.jpg" alt="Harry Potter" /></div>

                    <small>Sezon 1</small>
                </a>
                <a href="https://www.dizibox.live/diziler/neuromancer/" title="Neuromancer 1. Sezon" class="series-card">

                    <span>Neuromancer</span>
                    <small>Sezon 1</small>
                </a>
                <a href="https://www.dizibox.live/diziler/blade-runner-2099/" title="Blade Runner 2099 1. Sezon" class="series-card">

                    <span>Blade Runner 2099</span>
                    <small>Sezon 1</small>
                </a>
                <a href="https://www.dizibox.live/diziler/the-ghost-in-the-shell/" title="The Ghost in the Shell 1. Sezon" class="series-card">
                    <div class="poster"><img src="https://www.dizibox.live/wp-content/uploads/the-ghost-in-the-shell.jpg" alt="The Ghost in the Shell" /></div>
                    <span>The Ghost in the Shell</span>
                    <small>Sezon 1</small>
